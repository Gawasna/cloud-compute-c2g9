# ==============================================================================
# Bugsink Compose - Optimized for HP EliteDesk (User: ikari)
# Hardware Profile: Intel i5 8500T (35W TDP) / 8GB RAM Node
# Engine: Rootless Docker (UID 1002) - Cgroup v2 unprivileged compliant
# Storage: Embedded SQLite (/data/db.sqlite3) - Single-container footprint
# ==============================================================================

services:
  bugsink:
    image: bugsink/bugsink:2
    container_name: ops_bugsink
    restart: unless-stopped
    ports:
      # In rootlesskit, binding directly to 0.0.0.0 or a specific host port routes all traffic properly
      - "${BUGSINK_PORT:-35800}:8000"
    volumes:
      - ./data:/data
    environment:
      - PORT=8000
      - SECRET_KEY=${BUGSINK_SECRET_KEY}
      - CREATE_SUPERUSER=${BUGSINK_SUPERUSER:-admin@cloudstock.local:CloudStockOps2026!}
      - BASE_URL=${BUGSINK_BASE_URL:-http://127.0.0.1:35800}
      - ALLOWED_HOSTS=${BUGSINK_ALLOWED_HOSTS:-127.0.0.1,localhost,100.103.109.18}
      - DATABASE_PATH=/data/db.sqlite3
      - SNAPPEA_NUM_WORKERS=1
      - PHONEHOME=False
      - TZ=Asia/Ho_Chi_Minh
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import requests; requests.get(\"http://localhost:8000/health/ready\").raise_for_status()'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
